# Build the image and push it to ECR, then roll the ECS service.
# Replaces Render's auto-deploy-on-merge for the Factory backend.
name: deploy-aws

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: cerebrumdev-backend
  ECS_CLUSTER: cerebrum
  ECS_SERVICE: cerebrumdev-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build --build-arg GIT_COMMIT="${{ github.sha }}" \n            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Roll the service if it exists
        run: |
          count=$(aws ecs describe-services --cluster "$ECS_CLUSTER"             --services "$ECS_SERVICE"             --query 'length(services[?status==`ACTIVE`])' --output text 2>/dev/null || echo 0)
          if [ "$count" = "1" ]; then
            aws ecs update-service --cluster "$ECS_CLUSTER"               --service "$ECS_SERVICE" --force-new-deployment >/dev/null
            echo "deployment triggered"
          else
            echo "image pushed; service not created yet"
          fi
