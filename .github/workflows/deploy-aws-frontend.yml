# Build the SPA and push it to ECR, then roll the ECS service.
#
# VITE_API_URL is EMPTY on purpose, and that is the whole point of this comment.
#
# Vite bakes it into the bundle at build time, so any absolute host here becomes
# a constant the SPA carries until someone rebuilds it. With the ALB's hostname
# baked in, moving DNS to cerebrum-dev.com would have served the app over HTTPS
# while it kept calling http://...elb.amazonaws.com -- mixed content, which
# browsers block outright. The DNS move would have looked done and the app would
# have been dead.
#
# frontend/src/api/factory.ts reads `VITE_API_URL || ''`, so empty means every
# call is same-origin: `/v1/...` against whatever host served the page. The ALB
# routes by PATH, not host -- /v1/*, /health, /ready, /version, /docs and
# /openapi.json go to the backend target group, everything else to this SPA --
# so same-origin resolves correctly under the ALB name, under
# www.cerebrum-dev.com, and under anything else pointed at that load balancer.
#
# The consequence worth keeping: a DNS cutover no longer needs a rebuild.
name: deploy-aws-frontend

on:
  push:
    branches: [master]
    paths: ['frontend/**', '.github/workflows/deploy-aws-frontend.yml']
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: cerebrumdev-frontend
  ECS_CLUSTER: cerebrum
  ECS_SERVICE: cerebrumdev-frontend
  VITE_API_URL: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -f frontend/Dockerfile.prod             --build-arg VITE_API_URL="$VITE_API_URL"             -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" frontend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Roll the service if it exists
        run: |
          count=$(aws ecs describe-services --cluster "$ECS_CLUSTER"             --services "$ECS_SERVICE"             --query 'length(services[?status==`ACTIVE`])' --output text 2>/dev/null || echo 0)
          if [ "$count" = "1" ]; then
            aws ecs update-service --cluster "$ECS_CLUSTER"               --service "$ECS_SERVICE" --force-new-deployment >/dev/null
            echo "deployment triggered"
          else
            echo "image pushed; service not created yet"
          fi
