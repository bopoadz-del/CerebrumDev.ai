name: CI

# One GitHub Actions run per change: the pull request into master.
# Do not also run on push to master — that retested the same squash-merge
# a second time. Feature branches never run CI until a PR exists.
# Production deploy (Render auto-deploy on master) is the main-branch build.
on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Pyflakes only -- see backend/ruff.toml for why the default rule set is
      # deliberately not used. Runs before pytest because an undefined name or
      # a duplicate test definition is cheaper to read here than as a confusing
      # test failure.
      - name: Lint (ruff, pyflakes)
        run: python -m ruff check .

      - name: Run pytest suite
        # -rs names every skipped test and its reason. A skip is invisible in
        # the default summary, so a platform-guarded test that quietly stops
        # running on the Linux runner would read as coverage it is not
        # providing. Reporting only; it cannot change a result.
        run: python -m pytest -rs

      # U2: production enables the coder when a key is set. The job above
      # is ENV=test only; this step is the keyed-path fixture — stub keys,
      # no paid calls, same RoleRunner entry points production uses.
      - name: Factory keyed-path fixtures (U2)
        env:
          FACTORY_CODER_ENABLED: "1"
          KEYED_PATH_CI: "1"
          KIMI_API_KEY: "ci-stub-not-a-real-key"
          CEREBRUM_LLM_API_KEY: "ci-stub-not-a-real-key"
          LLM_PROVIDER: kimi
        run: python -m pytest tests/factory/test_keyed_path_ci.py tests/factory/test_writer_coder_wiring.py tests/factory/test_kernel_coder_wiring.py -rs

      - name: Reject LotDesk-as-shipped fixture
        run: python -m app.factory.build.lotdesk_gate

      # Repo-wide gates (run from repo root, not backend/): every hollow
      # function must be implemented or registered in KNOWN_INCOMPLETE.md,
      # and no secret-shaped literal may ship on a non-test path.
      - name: Stub audit (implement or register)
        working-directory: .
        run: python scripts/audit_stubs.py

      - name: Gate audit (reachable, consumed, proven to refuse)
        working-directory: .
        run: python scripts/audit_gates.py

      - name: Secret scan
        working-directory: .
        run: python scripts/scan_secrets.py

      - name: Forbid VITE_API_KEY in frontend/src
        working-directory: .
        run: |
          if grep -R --line-number -E 'VITE_API_KEY' frontend/src; then
            echo "VITE_API_KEY must never appear in frontend/src (it would bake the master key into the static bundle)." >&2
            exit 1
          fi
          echo "ok: no VITE_API_KEY in frontend/src"

  # Incremental typecheck. Scope is backend/mypy.ini — not the whole tree.
  # Adding a new HTTP/ops helper under app/core/ means adding it to files=
  # and keeping this job green. Do not widen to factory god-files in this job.
  backend-types:
    name: Backend typecheck (mypy, scoped)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: mypy (scoped files= in mypy.ini)
        run: python -m mypy

  # F26 / windows_cp1252_parity. Linux agents cannot certify this.
  # Required (no continue-on-error / allow_failure). Workflow fails if red.
  windows-cp1252-parity:
    name: Windows cp1252 encoding parity (F13/F26)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
        shell: cmd
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Encoding + posture subset (F13/F26)
        shell: pwsh
        env:
          PYTHONIOENCODING: cp1252
          PYTHONUTF8: "0"
        run: |
          chcp 1252
          python -c "import sys; enc=(sys.stdout.encoding or '').lower().replace('_','-'); print('stdout-encoding', enc); assert enc in ('cp1252','windows-1252'), enc"
          python -m pytest -rs tests/factory/test_windows_cp1252_parity.py tests/factory/test_tester_isolation.py tests/factory/test_network_posture.py tests/factory/test_block_action_contract.py::test_dispatch_does_not_pass_on_a_block_refusal

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  frontend-e2e:
    name: Frontend Playwright (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Mocked factory surfaces
        run: npx playwright test e2e/factory_surfaces.spec.ts e2e/verify_email_boot.spec.ts

  docker:
    name: Production Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build -t cerebrumdev-backend:ci .
