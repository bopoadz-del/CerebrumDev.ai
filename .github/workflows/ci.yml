name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Pyflakes only -- see backend/ruff.toml for why the default rule set is
      # deliberately not used. Runs before pytest because an undefined name or
      # a duplicate test definition is cheaper to read here than as a confusing
      # test failure.
      - name: Lint (ruff, pyflakes)
        run: python -m ruff check .

      - name: Run pytest suite
        # -rs names every skipped test and its reason. A skip is invisible in
        # the default summary, so a platform-guarded test that quietly stops
        # running on the Linux runner would read as coverage it is not
        # providing. Reporting only; it cannot change a result.
        run: python -m pytest -rs

      # Repo-wide gates (run from repo root, not backend/): every hollow
      # function must be implemented or registered in KNOWN_INCOMPLETE.md,
      # and no secret-shaped literal may ship on a non-test path.
      - name: Stub audit (implement or register)
        working-directory: .
        run: python scripts/audit_stubs.py

      - name: Secret scan
        working-directory: .
        run: python scripts/scan_secrets.py

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  docker:
    name: Production Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t cerebrumdev-backend:ci .
