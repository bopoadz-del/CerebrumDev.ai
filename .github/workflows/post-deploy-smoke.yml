name: Post-deploy smoke

# Market-ready gate. Runs after merge to master (and on demand), not on PRs.
# A red unit job on a PR must not be this workflow.
#
# Render already has SMOKE_GATE_TOKEN. GitHub Actions often does not.
# The script waits for /health status=ok, /ready status=ready, and (when
# GITHUB_SHA is set) /version git_sha matching this commit, then:
#   - token/email set → full gated factory checks; fail the job on DEAD
#   - SMOKE_GATE_TOKEN unset (and no SMOKE_EMAIL+PASSWORD) → unauthenticated
#     health/ready/version only, PASS with a notice that gated checks skipped
# Never invent or commit a token value.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  live-smoke:
    name: Live factory smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run post-deploy smoke
        env:
          SMOKE_GATE_TOKEN: ${{ secrets.SMOKE_GATE_TOKEN }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_READY_WAIT_S: "300"
          # DNS has moved: cerebrum-dev.com, www and api all resolve to the
          # AWS load balancer, so these defaults are the public hostnames
          # again rather than the load balancer's generated name.
          #
          # SMOKE_FRONTEND is a separate variable because it once silently
          # measured the wrong thing: it pointed at a host still resolving to
          # the suspended Render origin, so the security-header probe read a
          # vendor error page and reported "1 dead kernel(s): security headers
          # (frontend)" on every merge -- including one whose backend was
          # verifiably healthy, with /version returning the merge sha.
          #
          # The frontend probe must use a host the :443 listener forwards to
          # cerebrumdev-frontend, because what it checks is the SPA's security
          # headers. That listener routes by HOST, so www is the SPA and api is
          # the backend -- they are not interchangeable here, and pointing this
          # at api would read the API's headers while reporting on the SPA.
          SMOKE_FRONTEND: ${{ vars.SMOKE_FRONTEND || 'https://www.cerebrum-dev.com' }}
        run: python3 scripts/post_deploy_smoke.py ${{ vars.FACTORY_BASE_URL || 'https://api.cerebrum-dev.com' }}
        # The API probes (/health, /ready, /version) need the host that
        # reaches the backend target group, which is api.cerebrum-dev.com.
        # Verified live: /version returns the deployed git_sha as JSON.
        # Both defaults stay overridable by repo variable, so a future move
        # needs no commit.
