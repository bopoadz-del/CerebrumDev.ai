services:
  - type: web
    name: cerebrumdev-backend
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter
    region: oregon
    envVars:
      - key: ENV
        value: production
      - key: CEREBRUM_DEV_API_KEY
        generateValue: true
        sync: false
      - key: CEREBRUM_API_URL
        value: https://cerebrum-blocks.onrender.com
      - key: CEREBRUM_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://cerebrumdev-frontend.onrender.com
      - key: CORS_ALLOW_ORIGINS
        value: https://cerebrumdev-frontend.onrender.com
      - key: PLATFORM_CHAT_FLOW_ENABLED
        value: "true"
      - key: ARCHITECT_LLM_DRAFTING_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: ollama
      - key: OLLAMA_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: kimi-k2.7-code:cloud
      - key: OLLAMA_API_KEY
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: QWEN_MODEL
        value: qwen-plus
      - key: CEREBRUM_LLM_API_KEY
        sync: false
      - key: CEREBRUM_LLM_BASE_URL
        value: https://api.moonshot.cn/v1
      - key: CEREBRUM_LLM_MODEL
        value: moonshot-v1-8k
      - key: TINKER_API_KEY
        sync: false
      - key: TINKER_BASE_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: TINKER_LORA_RANK
        value: "16"
      - key: TINKER_BATCH_SIZE
        value: "4"
      - key: TINKER_MAX_STEPS
        value: "10"
      - key: GROUNDED_ADAPTER_ENABLED
        value: "false"
      - key: GROUNDED_ADAPTER_REWRITE_PASS
        value: "false"
      - key: GROUNDED_ADAPTER_TIMEOUT
        value: "60"
      - key: MARKER_ENABLED
        value: "false"
      - key: CHROMA_PERSIST_DIR
        value: /app/storage/chroma
      - key: STORAGE_PATH
        value: /app/storage
      - key: PYTHONIOENCODING
        value: utf-8
    disk:
      name: cerebrumdev-storage
      mountPath: /app/storage
      sizeGB: 1

  - type: static
    name: cerebrumdev-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://cerebrumdev-backend.onrender.com
      - key: VITE_API_KEY
        sync: false
