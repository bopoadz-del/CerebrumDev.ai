# Store gate workflow for cerebrum-builds uild/** branches (proven 12/12).
# Copy to .github/workflows/store-gate.yml there. Not live on CerebrumDev.ai.
#
# Proven green 2026-09-16 on build/sess_c8b01eb6de53495c-4db4944f:
#  - detached container + exec (the image ENTRYPOINT boots the server, a
#    foreground docker run image python scripts/acceptance.py passes the
#    script as ARGS to the entrypoint and hangs until timeout)
#  - volume-mounted storage + STORAGE_PATH + wait-for-/health loop
#  - exec sets STORE_DOCKER_HEALTH=200 so docker_health_200 is measured
#  - parse matches the real output format (PASS name - detail)

name: Store acceptance gate

on:
  workflow_dispatch:
  push:
    branches:
      - "build/**"
      - "builds/**"
      - "artifact/**"

permissions:
  contents: read
  statuses: write

jobs:
  store-gate:
    name: acceptance.py in Docker (k/12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build artifact image
        run: docker build -t cerebrum-artifact:${{ github.sha }} .

      - name: Run scripts/acceptance.py inside the image
        run: |
          set -euo pipefail
          CONTAINER="cerebrum-gate-${{ github.sha }}"
          # The image ENTRYPOINT boots the server (alembic + uvicorn); the
          # acceptance script probes it over HTTP. Run detached, wait for
          # /health, then exec the script â€” a foreground `docker run image
          # python scripts/acceptance.py` passes the script as ARGS to the
          # entrypoint, which ignores them: the script never runs and the
          # step hangs until the workflow timeout.
          docker run -d --name "$CONTAINER" \
            -e PLATFORM_TOKEN=dev-local-token \
            -e STORAGE_PATH=/app/storage \
            -v storegate-storage-${{ github.sha }}:/app/storage \
            cerebrum-artifact:${{ github.sha }}
          trap 'docker rm -f "$CONTAINER" >/dev/null 2>&1 || true' EXIT
          healthy=0
          for i in $(seq 1 60); do
            if docker exec "$CONTAINER" python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)" >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            echo "service never became healthy inside the container"
            docker logs "$CONTAINER" || true
            exit 1
          fi
          docker exec -e PLATFORM_TOKEN=dev-local-token \
            -e STORE_DOCKER_HEALTH=200 "$CONTAINER" \
            python3 scripts/acceptance.py | tee acceptance.out

      - name: Parse k/12 and write result
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          text = Path("acceptance.out").read_text(encoding="utf-8", errors="replace")
          names = [
              "no_token_401", "missing_field_422", "enum_422", "ui_served_200",
              "rag_roundtrip_hit", "single_persistence_root",
              "ci_present_and_full_suite", "handler_bodies_distinct",
              "health_fail_closed", "openapi_committed", "docker_health_200",
              "authorship_floor",
          ]
          lines = []
          passed = 0
          for name in names:
              m = re.search(rf"(PASS|FAIL)\s+\b{name}\b", text)
              status = m.group(1) if m else "FAIL"
              if status == "PASS":
                  passed += 1
              lines.append({"name": name, "status": status, "detail": ""})
          result = {
              "schema_version": "store_gate.v1",
              "passed": passed,
              "total": 12,
              "ok": passed == 12,
              "lines": lines,
              "via": "acceptance.py in Docker",
          }
          Path("store_gate.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(f"store-gate {passed}/12 ok={result['ok']}")
          if passed != 12:
              sys.exit(1)
          PY

      - name: Upload k/12 artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-gate
          path: store_gate.json

      - name: Write commit status
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          payload = json.loads(Path("store_gate.json").read_text(encoding="utf-8"))
          state = "success" if payload["ok"] else "failure"
          body = {
              "state": state,
              "context": "store-gate",
              "description": f"acceptance.py in Docker {payload['passed']}/12",
          }
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=json.dumps(body).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer ${{ secrets.GITHUB_TOKEN }}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req, timeout=30)
          print("status written:", state, payload["passed"], "/12")
          PY
