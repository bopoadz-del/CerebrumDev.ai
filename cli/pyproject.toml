[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerebrum-cli"
version = "0.1.0"
description = "Terminal client for CerebrumDev.ai instances"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "respx>=0.20",
]

[project.scripts]
cerebrum = "cerebrum_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["cerebrum_cli"]
