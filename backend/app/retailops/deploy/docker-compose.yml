# Local RetailOps stack: PostgreSQL 16 + pgvector and the generated runtime.
# Usage (from repo root):
#   docker compose -f backend/app/retailops/deploy/docker-compose.yml up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: retailops
      POSTGRES_PASSWORD: retailops
      POSTGRES_DB: retailops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailops"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - retailops_pg:/var/lib/postgresql/data

  app:
    build:
      context: ../../../..
      dockerfile: backend/app/retailops/deploy/Dockerfile
    environment:
      RETAILOPS_DATABASE_URL: postgresql+psycopg://retailops:retailops@db:5432/retailops
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  retailops_pg:
